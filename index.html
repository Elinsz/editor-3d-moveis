    <script>

      // $(document).ready(function(){
      //   $('.sub-btn').click(function(){

      //   });

      // });

      document.addEventListener("DOMContentLoaded", function () {
            // Aguarda 100 milissegundos para atualizar o iframe
            setTimeout(function () {
                const iframe = document.getElementById("meuIframe");
                if (iframe) {
                    // Atualiza o iframe recarregando a mesma URL
                    iframe.src = iframe.src;
                }
            }, 3); // 3 milissegundos (ajuste conforme necessário)
        });

      document.addEventListener('DOMContentLoaded', function () {
        const closeBtn = document.querySelector('.close-btn');
        const menuBtn = document.querySelector('.menu-btn');
        const section = document.querySelector('section');
        const iframe = document.querySelector('section iframe');

        closeBtn.addEventListener('click', function () {
          section.style.marginLeft = '0px';
          iframe.style.marginLeft = '0'; // Opcional, para ajustar alinhamento interno
        });

        menuBtn.addEventListener('click', function () {
          section.style.marginLeft = '0px';
          /*iframe.style.marginLeft = '10px'; // Opcional*/
        });
      });


      $(document).ready(function () {
      $('.sub-btn').click(function () {
        const parentItem = $(this).closest('.item'); // O contêiner pai do botão clicado
        const subMenu = $(this).next('.sub-menu'); // Submenu associado
        const navLinks = $('.nav-links'); // Contêiner principal do menu

        subMenu.slideToggle(); // Expande/contrai o submenu
        $(this).find('.dropdown').toggleClass('rotate'); // Animação no ícone

        setTimeout(function () {
          // Verifica se o submenu é o último visível e ajusta o scroll
          if (parentItem.is(':nth-last-child(1)')) {
            const offset = parentItem.position().top + parentItem.outerHeight() - navLinks.height();
            navLinks.scrollTop(offset > 0 ? offset + 25 : 0); // Ajusta o scroll com margem extra
          }
        }, 300); // Tempo da animação
      });
    });


    </script>
