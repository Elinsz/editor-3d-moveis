<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor 3D - Móveis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="canvas-container"></div>
    <div id="control-panel">
        <button onclick="addModule()">Adicionar Módulo</button>
        <button onclick="saveModules()">Salvar</button>
        <button onclick="loadModules()">Carregar</button>
        <div class="input-group">
            <label>Largura:</label>
            <input type="number" id="width" value="50">
        </div>
        <div class="input-group">
            <label>Altura:</label>
            <input type="number" id="height" value="80">
        </div>
        <div class="input-group">
            <label>Profundidade:</label>
            <input type="number" id="depth" value="50">
        </div>
    </div>
    <script src="../js/script.js"></script>
</body>
</html>
