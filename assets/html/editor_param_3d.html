<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor 3D - Móveis v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; display: flex; height: 100vh; background-color: #f0f0f0; }
        #canvas-container { flex-grow: 1; background-color: #1e1e1e; height: 100%; display: flex; justify-content: center; align-items: center; }
        #library-panel, #control-panel { width: 220px; padding: 20px; background-color: #fff; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); overflow-y: auto; }
        #library-panel { position: absolute; top: 0; left: 0; bottom: 0; z-index: 2; }
        #control-panel { position: absolute; top: 0; right: 0; bottom: 0; z-index: 2; }
        .menu { margin-bottom: 3px; }
        .dropdown-btn { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; cursor: pointer; text-align: left; font-size: 14px; border-radius: 5px; }
        .dropdown-btn:hover { background-color: #4CAF50; }
        .dropdown-content { display: none; padding-left: 14px; margin-top: 6px; margin-bottom: 6px; }
        .menu.active .dropdown-content { display: block; }
        .dropdown-content button { width: 100%; padding: 10px; background-color: #17a2b8; border: 1px solid #b3b3b3; margin-top: 14px; text-align: center; cursor: pointer; border-radius: 3px; }
        .dropdown-content button:hover { background-color: #117a8b; }
        button { padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 14px; border-radius: 5px; width: 100%; margin-top: 10px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="library-panel">
        <div class="menu">
            <button class="dropdown-btn">Biblioteca de Componentes ▾</button>
            <div class="dropdown-content">
                <button onclick="loadComponent('Componente 1')">Componente 1</button>
                <button onclick="loadComponent('Componente 2')">Componente 2</button>
                <button onclick="loadComponent('Componente 3')">Componente 3</button>
            </div>
        </div>
        <div class="menu">
            <button class="dropdown-btn">Componentes de Testes Salvos ▾</button>
            <div class="dropdown-content" id="saved-components">
                <p>Nenhum componente salvo.</p>
            </div>
        </div>
    </div>
    <div id="control-panel">
        <div class="menu">
            <button class="dropdown-btn">Ações ▾</button>
            <div class="dropdown-content">
                <button onclick="addModule()">Adicionar Módulo</button>
                <button onclick="saveModules()">Salvar</button>
                <button onclick="loadModules()">Carregar</button>
            </div>
        </div>

        <div class="menu">
            <button class="dropdown-btn">Dimensões ▾</button>
            <div class="dropdown-content">
                <label>Largura (mm):</label>
                <input type="number" id="width" value="500">
                <label>Altura (mm):</label>
                <input type="number" id="height" value="800">
                <label>Profundidade (mm):</label>
                <input type="number" id="depth" value="500">
                <button onclick="applyDimensions()">Aplicar</button>
            </div>
        </div>

        <div class="menu">
            <button class="dropdown-btn">Configuração de Espessuras ▾</button>
            <div class="dropdown-content">
                <label>Lateral:</label>
                <select id="espessura-lateral">
                    <option value="15">15mm</option>
                    <option value="18" selected>18mm</option>
                    <option value="25">25mm</option>
                </select>

                <label>Base:</label>
                <select id="espessura-base">
                    <option value="15">15mm</option>
                    <option value="18" selected>18mm</option>
                    <option value="25">25mm</option>
                </select>

                <label>Fundo:</label>
                <select id="espessura-fundo">
                    <option value="6">6mm</option>
                    <option value="9">9mm</option>
                    <option value="12">12mm</option>
                    <option value="15">15mm</option>
                    <option value="18">18mm</option>
                    <option value="25">25mm</option>
                </select>
            </div>
        </div>

        <div class="menu">
            <button class="dropdown-btn">Configuração de Materiais ▾</button>
            <div class="dropdown-content">
                <label>Material Lateral:</label>
                <input type="text" id="material-lateral" value="MDF Branco">
                <label>Material Base:</label>
                <input type="text" id="material-base" value="MDF Branco">
                <label>Material Fundo:</label>
                <input type="text" id="material-fundo" value="HDF Branco">
                <button onclick="applyMaterials()">Aplicar</button>

            </div>
        </div>
    </div>

    <script>
    let scene, camera, renderer, controls;

    function init() {
    const container = document.getElementById('canvas-container');

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 5000);
    camera.position.set(500, 500, 500);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
    directionalLight.position.set(300, 300, 300);
    scene.add(directionalLight);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    controls.screenSpacePanning = false;
    controls.maxPolarAngle = Math.PI;

    // Grade plana (opcional)
    const gridHelper = new THREE.GridHelper(1000, 20, 0x888888, 0x444444);
    gridHelper.position.y = 0;
    scene.add(gridHelper);

    // Eixos Absolutos em 3D Personalizados
    drawAxis3D();

    animate();
    }

    function drawAxis3D() {
        const axisLength = 500;

        // Eixo X (Vermelho)
        const xMaterial = new THREE.LineBasicMaterial({ color: 0xff0000 });
        const xPoints = [new THREE.Vector3(-axisLength, 0, 0), new THREE.Vector3(axisLength, 0, 0)];
        const xGeometry = new THREE.BufferGeometry().setFromPoints(xPoints);
        const xLine = new THREE.Line(xGeometry, xMaterial);
        scene.add(xLine);

        // Eixo Y (Verde)
        const yMaterial = new THREE.LineBasicMaterial({ color: 0x00ff00 });
        const yPoints = [new THREE.Vector3(0, -axisLength, 0), new THREE.Vector3(0, axisLength, 0)];
        const yGeometry = new THREE.BufferGeometry().setFromPoints(yPoints);
        const yLine = new THREE.Line(yGeometry, yMaterial);
        scene.add(yLine);

        // Eixo Z (Azul)
        const zMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff });
        const zPoints = [new THREE.Vector3(0, 0, -axisLength), new THREE.Vector3(0, 0, axisLength)];
        const zGeometry = new THREE.BufferGeometry().setFromPoints(zPoints);
        const zLine = new THREE.Line(zGeometry, zMaterial);
        scene.add(zLine);

        // Esfera na Origem (0, 0, 0)
        const originGeometry = new THREE.SphereGeometry(10, 16, 16);
        const originMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const originSphere = new THREE.Mesh(originGeometry, originMaterial);
        originSphere.position.set(0, 0, 0);
        scene.add(originSphere);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
    });

    init();

        document.addEventListener('DOMContentLoaded', () => {
            const dropdownButtons = document.querySelectorAll('.dropdown-btn');

            dropdownButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const menu = button.parentElement;
                    menu.classList.toggle('active');
                });
            });
        });

        // Dentro da função createModule
        function createModule(width = 200, height = 400, depth = 300) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
            const module = new THREE.Mesh(geometry, material);
            module.position.set(0, height / 2, 0);
            scene.add(module);
        }
    </script>
</body>
</html>
