<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor 3D - Móveis v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; display: flex; height: 100vh; background-color: #f0f0f0; }
        #canvas-container { flex-grow: 1; background-color: #1e1e1e; height: 100%; display: flex; justify-content: center; align-items: center; }
        #library-panel, #control-panel { width: 220px; padding: 20px; background-color: #fff; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); overflow-y: auto; }
        #library-panel { position: absolute; top: 0; left: 0; bottom: 0; z-index: 2; }
        #control-panel { position: absolute; top: 0; right: 0; bottom: 0; z-index: 2; }
        .menu { margin-bottom: 3px; }
        .dropdown-btn { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; cursor: pointer; text-align: left; font-size: 14px; border-radius: 5px; }
        .dropdown-btn:hover { background-color: #45a049; }
        .dropdown-content { display: none; padding-left: 14px; margin-top: 6px; margin-bottom: 6px; }
        .menu.active .dropdown-content { display: block; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="library-panel">
        <div class="menu">
            <button class="dropdown-btn">Biblioteca de Componentes ▾</button>
            <div class="dropdown-content">
                <button onclick="loadComponent('Componente 1')">Componente 1</button>
                <button onclick="loadComponent('Componente 2')">Componente 2</button>
                <button onclick="loadComponent('Componente 3')">Componente 3</button>
            </div>
        </div>
    </div>
    <div id="control-panel">
        <div class="menu">
            <button class="dropdown-btn">Ações ▾</button>
            <div class="dropdown-content">
                <button onclick="addModule()">Adicionar Módulo</button>
            </div>
        </div>
        <div class="menu">
            <button class="dropdown-btn">Dimensões ▾</button>
            <div class="dropdown-content">
                <label>Largura (mm):</label>
                <input type="number" id="width" value="500">
                <label>Altura (mm):</label>
                <input type="number" id="height" value="800">
                <label>Profundidade (mm):</label>
                <input type="number" id="depth" value="500">
                <button onclick="applyDimensions()">Aplicar</button>
            </div>
        </div>
    </div>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 300, 500);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth - 250, window.innerHeight);
        renderer.setClearColor(0x1e1e1e);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.maxPolarAngle = Math.PI / 2;

        let selectedModule = null;

        function createModule(width = 500, height = 800, depth = 500) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
            const module = new THREE.Mesh(geometry, material);
            module.position.set(0, height / 2, 0);
            selectedModule = module;
            scene.add(module);
        }

        function addModule() {
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            const depth = parseFloat(document.getElementById('depth').value);
            createModule(width, height, depth);
        }

        function applyDimensions() {
            if (selectedModule) {
                const width = parseFloat(document.getElementById('width').value);
                const height = parseFloat(document.getElementById('height').value);
                const depth = parseFloat(document.getElementById('depth').value);
                selectedModule.geometry.dispose();
                selectedModule.geometry = new THREE.BoxGeometry(width, height, depth);
                selectedModule.position.set(0, height / 2, 0);
            }
        }

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1).normalize();
        scene.add(light);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = (window.innerWidth - 250) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 250, window.innerHeight);
        });

        document.querySelectorAll('.dropdown-btn').forEach(button => {
            button.addEventListener('click', function () {
                this.parentElement.classList.toggle('active');
            });
        });
    </script>
</body>
</html>
