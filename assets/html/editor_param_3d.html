<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor 3D - Móveis v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/OrbitControls/2.110.3/OrbitControls.min.js"></script>
    <script src="https://threejs.org/examples/js/exporters/STLExporter.js"></script>

    <link rel="stylesheet" href="../css/style_ed-3d.css">

</head>
<body>
    <div id="canvas-container"></div>
    <div id="library-panel">
        <div class="menu">
            <button class="dropdown-btn">Biblioteca Geral ▾</button>
            <div class="dropdown-content">
                <button onclick="loadComponent('Componente 1')">Componente 1</button>
                <button onclick="loadComponent('Componente 2')">Componente 2</button>
                <button onclick="loadComponent('Componente 3')">Componente 3</button>
            </div>
        </div>
        <!-- <div class="menu">
            <button class="dropdown-btn">Componentes em Testes ▾</button>
            <div class="dropdown-content" id="saved-components">
                <p>Nenhum componente salvo.</p>
            </div>
        </div> -->
    </div>
    <div id="control-panel">
        <div class="menu">
            <button class="dropdown-btn">Ações ▾</button>
            <div class="dropdown-content">
                <button onclick="addModule()">Criar Novo Bloco</button>
                <button onclick="addModule()">Adicionar Módulo</button>
                <button onclick="edtModule()">Editar Módulo</button>
                <button onclick="saveModules()">Salvar</button>
                <button onclick="loadModules()">Carregar</button>
            </div>
        </div>

        <div class="menu">
            <button class="dropdown-btn">Criar Peças ▾</button>
            <div class="dropdown-content">
                <select id="piece-type">
                    <option value="Lateral Direita" onclick="createLateral()">Lateral Direita</option>
                    <option value="Lateral Esquerda" onclick="createLateral()">Lateral Esquerda</option>
                    <option value="Base Inf">Base Inf</option>
                    <option value="Base Sup">Base Sup</option>
                    <option value="Frente Gaveta">Frente Gaveta</option>
                    <option value="Porta Dir">Porta Direita</option>
                    <option value="Porta Esq">Porta Esquerda</option>
                </select>
                <button onclick="startPlacingPiece()">Posicionar Peça</button>
            </div>
        </div>


        <div class="menu">
            <button class="dropdown-btn">Configurações do Componente ▾</button>
            <div class="dropdown-content">
                <h1></h1>
                <label>Largura (mm):</label>
                <input type="number" id="width" value="500"/>
                <h1></h1>
                <label>Altura (mm):</label>
                <input type="number" id="height" value="800"/>
                <h1></h1>
                <label>Profundidade (mm):</label>
                <input type="number" id="depth" value="500"/>
                <h2></h2>
                <label>Tipo de Fundo:</label>
                <select id="tp-fundo">
                    <option value="Sem Fundo">Sem Fundo</option>
                    <option value="Fundo no canal">Fundo no canal</option>
                    <option value="Fundo por tras" selected>Fundo por tras</option>
                </select>

                <button onclick="applyDimensions()">Aplicar</button>
            </div>
        </div>

        <div class="menu">
            <button class="dropdown-btn">Configuração de Espessuras ▾</button>
            <div class="dropdown-content">
                <label>Lateral:</label>
                <select id="espessura-lateral">
                    <option value="15">15mm</option>
                    <option value="18" selected>18mm</option>
                    <option value="25">25mm</option>
                </select>

                <label>Base:</label>
                <select id="espessura-base">
                    <option value="15">15mm</option>
                    <option value="18" selected>18mm</option>
                    <option value="25">25mm</option>
                </select>

                <label>Fundo:</label>
                <select id="espessura-fundo">
                    <option value="6">6mm</option>
                    <option value="9">9mm</option>
                    <option value="12">12mm</option>
                    <option value="15">15mm</option>
                    <option value="18">18mm</option>
                    <option value="25">25mm</option>
                </select>
            </div>
        </div>

        <div class="menu">
            <button class="dropdown-btn">Configuração de Materiais ▾</button>
            <div class="dropdown-content">
                <label>Material Lateral:</label>
                <input type="text" id="material-lateral" value="MDF Branco">
                <label>Material Base:</label>
                <input type="text" id="material-base" value="MDF Branco">
                <label>Material Fundo:</label>
                <input type="text" id="material-fundo" value="HDF Branco">
                <button onclick="applyMaterials()">Aplicar</button>

            </div>
        </div>
    </div>
    <script src="../js/script_ed-3d.js"></script>
</body>
</html>
