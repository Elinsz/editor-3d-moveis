<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor 3D Paramétrico</title>
  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      flex-direction: column;
    }
    #editor-container {
      display: flex;
      flex-grow: 1;
    }
    #controls {
      width: 300px;
      padding: 10px;
      background-color: #f0f0f0;
    }
    canvas {
      flex-grow: 1;
    }
  </style>
</head>
<body>
  <div id="editor-container">
    <div id="controls">
      <h3>Controle de Dimensões</h3>
      <label for="width">Largura:</label>
      <input type="number" id="width" value="100">
      <br>
      <label for="height">Altura:</label>
      <input type="number" id="height" value="200">
      <br>
      <label for="depth">Profundidade:</label>
      <input type="number" id="depth" value="20">
      <br>
      <label for="thickness">Espessura:</label>
      <input type="number" id="thickness" value="5">
      <br>
      <button id="export-stl">Exportar STL</button>
    </div>
    <canvas id="3d-canvas"></canvas>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stl-file-export@0.1.2/build/stl-file-export.min.js"></script>
  <script>
    // Setup da cena 3D
    let scene, camera, renderer, geometry, material, mesh;

    function init3D() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('3d-canvas') });
      renderer.setSize(window.innerWidth - 300, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Criar geometria básica (um retângulo paramétrico)
      geometry = new THREE.BoxGeometry(100, 200, 20);
      material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
      mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      camera.position.z = 500;

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    // Atualizar dimensões com base nos inputs
    function updateDimensions() {
      const width = parseFloat(document.getElementById('width').value);
      const height = parseFloat(document.getElementById('height').value);
      const depth = parseFloat(document.getElementById('depth').value);
      const thickness = parseFloat(document.getElementById('thickness').value);

      geometry = new THREE.BoxGeometry(width, height, depth);
      mesh.geometry.dispose();
      mesh.geometry = geometry;
    }

    // Função de exportação STL
    function exportSTL() {
      const exporter = new STLExporter();
      const stlData = exporter.parse(mesh);
      const blob = new Blob([stlData], { type: 'application/sla' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'model.stl';
      link.click();
    }

    // Inicializar
    window.onload = function() {
      init3D();
      document.getElementById('width').addEventListener('input', updateDimensions);
      document.getElementById('height').addEventListener('input', updateDimensions);
      document.getElementById('depth').addEventListener('input', updateDimensions);
      document.getElementById('thickness').addEventListener('input', updateDimensions);
      document.getElementById('export-stl').addEventListener('click', exportSTL);
    };
  </script>
</body>
</html>
