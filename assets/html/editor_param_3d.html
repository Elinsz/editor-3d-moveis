<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor 3D - Móveis v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        /* Estilos básicos para o layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            background-color: #f0f0f0;
        }

        #canvas-container {
            flex-grow: 1;
            background-color: #fff;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #library-panel {
            width: 220px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        #control-panel {
            width: 265px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }

        /* Estilos para os menus de navegação */
        .menu {
            margin-bottom: 3px;
        }

        .dropdown-btn {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .dropdown-btn:hover {
            background-color: #4CAF50;
        }

        .dropdown-content {
            display: none;
            padding-left: 14px;
            margin-top: 6px;
            margin-bottom: 6px;
        }

        .menu.active .dropdown-content {
            display: block;
        }

        .dropdown-content button {
            width: 100%;
            padding: 10px;
            background-color: #17a2b8;
            border: 1px solid #b3b3b3;
            margin-top: 14px;
            text-align: center;
            cursor: pointer;
            border-radius: 3px;
        }

        .dropdown-content button:hover {
            background-color: #117a8b;
        }

        input[type="number"], input[type="text"], select {
            width: 100%;
            padding: 8px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
        }

        label {
            margin-top: 5px;
            margin-bottom: 5px;
        }

        button {
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            border-radius: 5px;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            background-color: #218838;
        }

        /* Estilos gerais de responsividade */
        @media (max-width: 1200px) {
            #library-panel, #control-panel {
                width: 200px;
            }
        }

        @media (max-width: 768px) {
            #library-panel, #control-panel {
                width: 150px;
            }

            #canvas-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="library-panel">
        <div class="menu">
            <button class="dropdown-btn">Biblioteca de Componentes ▾</button>
            <div class="dropdown-content">
                <button onclick="loadComponent('Componente 1')">Componente 1</button>
                <button onclick="loadComponent('Componente 2')">Componente 2</button>
                <button onclick="loadComponent('Componente 3')">Componente 3</button>
            </div>
        </div>
        <div class="menu">
            <button class="dropdown-btn">Componentes de Testes Salvos ▾</button>
            <div class="dropdown-content" id="saved-components">
                <p>Nenhum componente salvo.</p>
            </div>
        </div>
    </div>
    <div id="control-panel">
        <div class="menu">
            <button class="dropdown-btn">Ações ▾</button>
            <div class="dropdown-content">
                <button onclick="addModule()">Adicionar Módulo</button>
                <button onclick="saveModules()">Salvar</button>
                <button onclick="loadModules()">Carregar</button>
            </div>
        </div>

        <div class="menu">
            <button class="dropdown-btn">Dimensões ▾</button>
            <div class="dropdown-content">
                <label>Largura (mm):</label>
                <input type="number" id="width" value="500">
                <label>Altura (mm):</label>
                <input type="number" id="height" value="800">
                <label>Profundidade (mm):</label>
                <input type="number" id="depth" value="500">
                <button onclick="applyDimensions()">Aplicar</button>
            </div>
        </div>

        <div class="menu">
            <button class="dropdown-btn">Configuração de Espessuras ▾</button>
            <div class="dropdown-content">
                <label>Lateral:</label>
                <select id="espessura-lateral">
                    <option value="15">15mm</option>
                    <option value="18" selected>18mm</option>
                    <option value="25">25mm</option>
                </select>

                <label>Base:</label>
                <select id="espessura-base">
                    <option value="15">15mm</option>
                    <option value="18" selected>18mm</option>
                    <option value="25">25mm</option>
                </select>

                <label>Fundo:</label>
                <select id="espessura-fundo">
                    <option value="6">6mm</option>
                    <option value="9">9mm</option>
                    <option value="12">12mm</option>
                    <option value="15">15mm</option>
                    <option value="18">18mm</option>
                    <option value="25">25mm</option>
                </select>
            </div>
        </div>

        <div class="menu">
            <button class="dropdown-btn">Configuração de Materiais ▾</button>
            <div class="dropdown-content">
                <label>Material Lateral:</label>
                <input type="text" id="material-lateral" value="MDF Branco">
                <label>Material Base:</label>
                <input type="text" id="material-base" value="MDF Branco">
                <label>Material Fundo:</label>
                <input type="text" id="material-fundo" value="HDF Branco">
                <button onclick="applyMaterials()">Aplicar</button>

            </div>
        </div>
    </div>

    <script>
// CENA E CÂMERA
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 300, 500);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth - 250, window.innerHeight);
renderer.setClearColor(0xf0f0f0);
document.getElementById('canvas-container').appendChild(renderer.domElement);

// CONTROLES DE CÂMERA
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.screenSpacePanning = false;
controls.maxPolarAngle = Math.PI / 2;

// Ambiente 3D (paredes, piso e teto)
function addEnvironment() {
    const roomMaterial = new THREE.MeshBasicMaterial({ color: 0xf5f5f5, side: THREE.BackSide });
    const roomGeometry = new THREE.BoxGeometry(1000, 500, 1000);
    const roomMesh = new THREE.Mesh(roomGeometry, roomMaterial);
    roomMesh.position.y = 250;
    scene.add(roomMesh);
}

addEnvironment();

// Função para aplicar as dimensões ao módulo
function applyDimensions() {
    const width = parseFloat(document.getElementById('width').value);
    const height = parseFloat(document.getElementById('height').value);
    const depth = parseFloat(document.getElementById('depth').value);

    if (selectedModule) {
        selectedModule.scale.set(width / 200, height / 400, depth / 300);
    }
}

// Função para aplicar os materiais
function applyMaterials() {
    const lateral = document.getElementById('material-lateral').value;
    const base = document.getElementById('material-base').value;
    const fundo = document.getElementById('material-fundo').value;
    alert(`Materiais Aplicados:\nLateral: ${lateral}\nBase: ${base}\nFundo: ${fundo}`);
}

// Variáveis de controle dos módulos
let selectedModule = null;

// EXEMPLO DE MÓDULO (caixa)
function createModule(width = 200, height = 400, depth = 300, color = 0x00ff00) {
    const geometry = new THREE.BoxGeometry(width, height, depth);
    const material = new THREE.MeshBasicMaterial({ color });
    const module = new THREE.Mesh(geometry, material);
    module.position.y = height / 2;
    module.userData.draggable = true;

    module.addEventListener('click', () => {
        selectedModule = module;
    });

    scene.add(module);
}

// Função para adicionar um componente salvo
function addSavedComponent(componentName, width, height, depth, color) {
    const savedComponentsPanel = document.getElementById('saved-components');

    const componentButton = document.createElement('button');
    componentButton.textContent = componentName;
    componentButton.onclick = function() {
        createModule(width, height, depth, color);  // Cria o módulo com as dimensões e cor definidas
    };

    savedComponentsPanel.appendChild(componentButton);
}

// Função para carregar os componentes salvos
function loadSavedComponents() {
    const componentsData = [
        { id: 1, name: 'Caixa Alta', width: 300, height: 600, depth: 400, color: 0xff0000 },
        { id: 2, name: 'Caixa Baixa', width: 500, height: 300, depth: 500, color: 0x00ff00 }
    ];

    const savedComponentsPanel = document.getElementById('saved-components');
    savedComponentsPanel.innerHTML = ''; // Limpa o conteúdo anterior

    componentsData.forEach(component => {
        addSavedComponent(component.name, component.width, component.height, component.depth, component.color);
    });
}

// Carrega os componentes salvos
loadSavedComponents();

// ANIMAÇÃO DA CENA
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

animate();

// FUNÇÕES DE BOTÕES
function addModule() {
    createModule();
}

function saveModules() {
    alert('Módulos salvos (simulado)');
}

function loadModules() {
    alert('Módulos carregados (simulado)');
}

// CONTROLE DOS DROPDOWNS
document.querySelectorAll('.dropdown-btn').forEach(button => {
    button.addEventListener('click', function () {
        const menu = this.parentElement;
        menu.classList.toggle('active');
    });
});

// Ajusta a tela em caso de redimensionamento
window.addEventListener('resize', () => {
    camera.aspect = (window.innerWidth - 250) / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth - 250, window.innerHeight);
});
    </script>
</body>
</html>
