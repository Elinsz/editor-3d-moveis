<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor 3D - Móveis v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; display: flex; height: 100vh; background-color: #f0f0f0; }
        #canvas-container { flex-grow: 1; background-color: #1e1e1e; height: 100%; display: flex; justify-content: center; align-items: center; }
        #library-panel, #control-panel { width: 220px; padding: 20px; background-color: #fff; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); overflow-y: auto; }
        #library-panel { position: absolute; top: 0; left: 0; bottom: 0; z-index: 2; }
        #control-panel { position: absolute; top: 0; right: 0; bottom: 0; z-index: 2; }
        .menu { margin-bottom: 3px; }
        .dropdown-btn { width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; cursor: pointer; text-align: left; font-size: 14px; border-radius: 5px; }
        .dropdown-content { display: none; padding-left: 14px; margin-top: 6px; }
        .menu.active .dropdown-content { display: block; }
        .dropdown-content button { width: 100%; padding: 10px; background-color: #17a2b8; border: 1px solid #b3b3b3; margin-top: 6px; text-align: center; cursor: pointer; border-radius: 3px; color: white; }
        button { padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; font-size: 14px; border-radius: 5px; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="library-panel">
        <div class="menu">
            <button class="dropdown-btn">Biblioteca de Componentes ▾</button>
            <div class="dropdown-content">
                <button>Componente 1</button>
                <button>Componente 2</button>
                <button>Componente 3</button>
            </div>
        </div>
    </div>
    <div id="control-panel">
        <div class="menu">
            <button class="dropdown-btn">Ações ▾</button>
            <div class="dropdown-content">
                <button onclick="addModule()">Adicionar Módulo</button>
            </div>
        </div>
        <div class="menu">
            <button class="dropdown-btn">Dimensões ▾</button>
            <div class="dropdown-content">
                <label>Largura:</label>
                <input type="number" id="width" value="500">
                <label>Altura:</label>
                <input type="number" id="height" value="800">
                <label>Profundidade:</label>
                <input type="number" id="depth" value="500">
            </div>
        </div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 300, 500);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth - 250, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2;

        function addAxis() {
            const axisHelper = new THREE.AxesHelper(200);
            scene.add(axisHelper);
        }
        addAxis();

        let selectedModule = null;

        function addModule() {
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            const depth = parseFloat(document.getElementById('depth').value);

            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
            const module = new THREE.Mesh(geometry, material);

            module.position.set(0, height / 2, 0);

            scene.add(module);
            selectedModule = module;
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = (window.innerWidth - 250) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 250, window.innerHeight);
        });

        document.querySelectorAll('.dropdown-btn').forEach(button => {
            button.addEventListener('click', function () {
                const menu = this.parentElement;
                menu.classList.toggle('active');
            });
        });
    </script>
</body>
</html>
