
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor 3D Paramétrico</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/STLExporter.js"></script>
    <!-- <link rel="stylesheet" href="style.css"> -->

    <style>
        body { margin: 0; display: flex; height: 100vh; }
        #canvas-container { flex-grow: 1; position: relative; background-color: #f0f0f0; }
        #control-panel { width: 300px; padding: 10px; background-color: #ddd; overflow-y: auto; }
        .menu { margin-bottom: 10px; }
        .menu label, .menu select, .menu input { display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="canvas-container" style="width: 70vw; height: 80vh; float: left;"></div>
    <div id="control-panel" style="width: 25vw; float: right;">
        <div>
            <h3>Adicionar Módulo</h3>
            <button onclick="addModule()">Criar Novo</button>
        </div>
        <div>
            <h3>Criar Peças</h3>
            <select id="piece-type">
                <option value="Lateral Direita">Lateral Direita</option>
                <option value="Lateral Esquerda">Lateral Esquerda</option>
                <option value="Base Inf">Base Inferior</option>
                <option value="Base Sup">Base Superior</option>
                <option value="Frente Gaveta">Frente Gaveta</option>
                <option value="Porta Dir">Porta Direita</option>
                <option value="Porta Esq">Porta Esquerda</option>
            </select>
            <button onclick="createPiece(document.getElementById('piece-type').value)">Criar Peça</button>
        </div>
        <div>
            <h3>Exportar</h3>
            <button onclick="exportToDXF()">Exportar DXF</button>
            <button onclick="exportToSKP()">Exportar SKP</button>
            <button onclick="exportToSTL()">Exportar STL</button>
        </div>
    </div>
    <!-- <script src="script.js"></script> -->

    <script>
        let scene, camera, renderer, controls, gridHelper;

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 1, 10000);
            camera.position.set(500, 500, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.25;
            controls.screenSpacePanning = false;
            controls.maxPolarAngle = Math.PI / 2;

            gridHelper = new THREE.GridHelper(2000, 50);
            scene.add(gridHelper);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(100, 200, 300);
            scene.add(directionalLight);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function addModule() {
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            const depth = parseFloat(document.getElementById('depth').value);
            const espessuraLateral = parseFloat(document.getElementById('espessuraLateral').value);
            const espessuraBase = parseFloat(document.getElementById('espessuraBase').value);
            const espessuraFrente = parseFloat(document.getElementById('espessuraFrente').value);

            const group = new THREE.Group();

            const material = new THREE.MeshStandardMaterial({ color: 0xcfcfcf });

            const lateralEsq = new THREE.Mesh(new THREE.BoxGeometry(espessuraLateral, height, depth), material);
            lateralEsq.position.set(-width / 2 + espessuraLateral / 2, height / 2, 0);
            group.add(lateralEsq);

            const lateralDir = new THREE.Mesh(new THREE.BoxGeometry(espessuraLateral, height, depth), material);
            lateralDir.position.set(width / 2 - espessuraLateral / 2, height / 2, 0);
            group.add(lateralDir);

            const base = new THREE.Mesh(new THREE.BoxGeometry(width, espessuraBase, depth), material);
            base.position.set(0, espessuraBase / 2, 0);
            group.add(base);

            const frente = new THREE.Mesh(new THREE.BoxGeometry(width, height, espessuraFrente), material);
            frente.position.set(0, height / 2, depth / 2 - espessuraFrente / 2);
            group.add(frente);

            group.position.set(0, 0, 0);
            scene.add(group);
        }

        function exportGLTF() {
            const exporter = new THREE.GLTFExporter();
            exporter.parse(scene, function (result) {
                const blob = new Blob([JSON.stringify(result)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = 'module.gltf';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
            }, { binary: false });
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
