
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor 3D Paramétrico</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/STLExporter.js"></script>
    <!-- <link rel="stylesheet" href="style.css"> -->

    <style>
        body { margin: 0; display: flex; height: 100vh; }
        #canvas-container { flex-grow: 1; position: relative; background-color: #f0f0f0; }
        #control-panel { width: 300px; padding: 10px; background-color: #ddd; overflow-y: auto; }
        .menu { margin-bottom: 10px; }
        .menu label, .menu select, .menu input { display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div id="canvas-container" style="width: 70vw; height: 80vh; float: left;"></div>
    <div id="control-panel" style="width: 25vw; float: right;">
        <div>
            <h3>Adicionar Módulo</h3>
            <button onclick="addModule()">Criar Novo</button>
        </div>
        <div>
            <h3>Criar Peças</h3>
            <select id="piece-type">
                <option value="Lateral Direita">Lateral Direita</option>
                <option value="Lateral Esquerda">Lateral Esquerda</option>
                <option value="Base Inf">Base Inferior</option>
                <option value="Base Sup">Base Superior</option>
                <option value="Frente Gaveta">Frente Gaveta</option>
                <option value="Porta Dir">Porta Direita</option>
                <option value="Porta Esq">Porta Esquerda</option>
            </select>
            <button onclick="createPiece(document.getElementById('piece-type').value)">Criar Peça</button>
        </div>
        <div>
            <h3>Exportar</h3>
            <button onclick="exportToDXF()">Exportar DXF</button>
            <button onclick="exportToSKP()">Exportar SKP</button>
            <button onclick="exportToSTL()">Exportar STL</button>
        </div>
    </div>
    <!-- <script src="script.js"></script> -->

    <script>
    // script.js

    let scene, camera, renderer, controls;
    let driverBlock;
    const components = [];

    function init() {
        const container = document.getElementById('canvas-container');

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(200, 200, 200);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.25;
        controls.screenSpacePanning = false;
        controls.maxPolarAngle = Math.PI / 2;

        const gridHelper = new THREE.GridHelper(500, 50);
        scene.add(gridHelper);

        const axesHelper = new THREE.AxesHelper(100);
        scene.add(axesHelper);

        createRoom();
        createCoordinateSystem();

        animate();
    }

    function createRoom() {
        const roomMaterial = new THREE.MeshBasicMaterial({ color: 0xdddddd, side: THREE.BackSide });

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), roomMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), roomMaterial);
        ceiling.position.y = 250;
        ceiling.rotation.x = Math.PI / 2;
        scene.add(ceiling);

        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(500, 250), roomMaterial);
        backWall.position.z = -250;
        backWall.position.y = 125;
        scene.add(backWall);

        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(500, 250), roomMaterial);
        leftWall.position.x = -250;
        leftWall.position.y = 125;
        leftWall.rotation.y = Math.PI / 2;
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(500, 250), roomMaterial);
        rightWall.position.x = 250;
        rightWall.position.y = 125;
        rightWall.rotation.y = -Math.PI / 2;
        scene.add(rightWall);
    }

    function createCoordinateSystem() {
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x0000ff });

        const points = [];
        for (let i = -250; i <= 250; i += 50) {
            points.push(new THREE.Vector3(i, 0, -250));
            points.push(new THREE.Vector3(i, 0, 250));
            points.push(new THREE.Vector3(-250, 0, i));
            points.push(new THREE.Vector3(250, 0, i));
        }

        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const lines = new THREE.LineSegments(geometry, lineMaterial);
        scene.add(lines);
    }

    function addModule() {
        const width = parseFloat(document.getElementById('width').value);
        const height = parseFloat(document.getElementById('height').value);
        const depth = parseFloat(document.getElementById('depth').value);

        const geometry = new THREE.BoxGeometry(width, height, depth);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        driverBlock = new THREE.Mesh(geometry, material);
        driverBlock.position.set(0, height / 2, 0);

        scene.add(driverBlock);
        components.push(driverBlock);
    }

    function createPiece(type) {
        let pieceGeometry;
        let pieceMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });

        switch (type) {
            case 'Lateral Direita':
            case 'Lateral Esquerda':
                pieceGeometry = new THREE.BoxGeometry(18, driverBlock.geometry.parameters.height, driverBlock.geometry.parameters.depth);
                break;
            case 'Base Inf':
            case 'Base Sup':
                pieceGeometry = new THREE.BoxGeometry(driverBlock.geometry.parameters.width, 18, driverBlock.geometry.parameters.depth);
                break;
            case 'Frente Gaveta':
            case 'Porta Dir':
            case 'Porta Esq':
                pieceGeometry = new THREE.BoxGeometry(driverBlock.geometry.parameters.width, driverBlock.geometry.parameters.height / 2, 18);
                break;
            default:
                console.error('Peça desconhecida:', type);
                return;
        }

        const piece = new THREE.Mesh(pieceGeometry, pieceMaterial);
        piece.position.set(0, pieceGeometry.parameters.height / 2, 0);

        scene.add(piece);
        components.push(piece);
    }

    function exportToDXF() {
        alert('Exportar para DXF ainda não implementado');
    }

    function exportToSKP() {
        alert('Exportar para SKP ainda não implementado');
    }

    function exportToSTL() {
        const exporter = new THREE.STLExporter();
        const result = exporter.parse(scene);

        const blob = new Blob([result], { type: 'application/octet-stream' });
        const url = URL.createObjectURL(blob);

        const link = document.createElement('a');
        link.href = url;
        link.download = 'model.stl';
        link.click();
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    init();


    </script>
</body>
</html>
