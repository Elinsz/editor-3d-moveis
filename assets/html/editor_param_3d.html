<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor 3D - Móveis v2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        /* Estilos básicos para o layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            background-color: #f0f0f0;
        }

        #canvas-container {
            flex-grow: 1;
            background-color: #fff;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #library-panel, #control-panel {
            width: 220px;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            position: absolute;
            top: 0;
            bottom: 0;
            z-index: 2;
        }

        #library-panel {
            left: 0;
        }

        #control-panel {
            right: 0;
        }

        .menu {
            margin-bottom: 3px;
        }

        .dropdown-btn {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .dropdown-btn:hover {
            background-color: #4CAF50;
        }

        .dropdown-content {
            display: none;
            padding-left: 14px;
            margin-top: 6px;
            margin-bottom: 6px;
        }

        .menu.active .dropdown-content {
            display: block;
        }

        .dropdown-content button {
            width: 100%;
            padding: 10px;
            background-color: #17a2b8;
            border: 1px solid #b3b3b3;
            margin-top: 14px;
            text-align: center;
            cursor: pointer;
            border-radius: 3px;
        }

        .dropdown-content button:hover {
            background-color: #117a8b;
        }

        /* Estilos para a área de visualização */
        #coordinates {
            position: absolute;
            top: 10px;
            left: 10px;
            font-family: Arial, sans-serif;
            color: #000;
            font-size: 16px;
        }

    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="library-panel">
        <div class="menu">
            <button class="dropdown-btn">Biblioteca de Componentes ▾</button>
            <div class="dropdown-content">
                <button onclick="loadComponent('Componente 1')">Componente 1</button>
                <button onclick="loadComponent('Componente 2')">Componente 2</button>
                <button onclick="loadComponent('Componente 3')">Componente 3</button>
            </div>
        </div>
    </div>
    <div id="control-panel">
        <div class="menu">
            <button class="dropdown-btn">Ações ▾</button>
            <div class="dropdown-content">
                <button onclick="addModule()">Adicionar Módulo</button>
                <button onclick="saveModules()">Salvar</button>
                <button onclick="loadModules()">Carregar</button>
            </div>
        </div>
    </div>
    <div id="coordinates"></div>
    <script>
        // CENA E CÂMERA
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 300, 500);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth - 250, window.innerHeight);
        renderer.setClearColor(0xf0f0f0);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // CONTROLES DE CÂMERA
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;
        controls.screenSpacePanning = false;
        controls.maxPolarAngle = Math.PI / 2;

        // EIXOS DE COORDENADAS
        const axesHelper = new THREE.AxesHelper(200);
        scene.add(axesHelper);

        // Função para aplicar as dimensões ao módulo
        function applyDimensions() {
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            const depth = parseFloat(document.getElementById('depth').value);

            if (selectedModule) {
                selectedModule.scale.set(width / 200, height / 400, depth / 300);
            }
        }

        // Variáveis de controle dos módulos
        let selectedModule = null;

        // EXEMPLO DE MÓDULO (caixa)
        function createModule(width = 200, height = 400, depth = 300, color = 0x00ff00) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshBasicMaterial({ color });
            const module = new THREE.Mesh(geometry, material);
            module.position.y = height / 2;
            module.userData.draggable = true;

            module.addEventListener('click', () => {
                selectedModule = module;
                updateCoordinates(module.position); // Atualiza as coordenadas ao selecionar
            });

            scene.add(module);
        }

        // Atualiza as coordenadas na tela
        function updateCoordinates(position) {
            const coordinatesElement = document.getElementById('coordinates');
            coordinatesElement.textContent = `X: ${position.x.toFixed(2)} | Y: ${position.y.toFixed(2)} | Z: ${position.z.toFixed(2)}`;
        }

        // Função de animação
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Funções de Botões
        function addModule() {
            createModule();
        }

        function saveModules() {
            alert('Módulos salvos (simulado)');
        }

        function loadModules() {
            alert('Módulos carregados (simulado)');
        }

        // Redimensiona o renderizado
        window.addEventListener('resize', () => {
            camera.aspect = (window.innerWidth - 250) / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 250, window.innerHeight);
        });
    </script>
</body>
</html>
